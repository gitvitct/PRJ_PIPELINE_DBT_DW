name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dbt-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install dbt-core dbt-postgres

      - name: Validate dbt Project
        run: |
          cd dbt_project
          dbt deps || true
          dbt parse