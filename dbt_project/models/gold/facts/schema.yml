version: 2

models:
  - name: fact_sales

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - sale_id
            - customer_sk

    columns:

      - name: sale_id
        tests:
          - not_null

      - name: customer_sk
        tests:
          - not_null

      - name: date_sk
        tests:
          - not_null

      - name: amount
        tests:
          - not_null