name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File
        run: |
          cat > docker/.env << EOF
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          AIRFLOW_DB=airflow
          DW_DB=sales_dw
          POSTGRES_SCHEMA=public
          DBT_TARGET=dev
          DBT_THREADS=2
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: |
          docker compose -f docker/docker-compose.yml config

      - name: Build Image
        run: |
          docker build \
            -t airflow-custom \
            -f docker/Dockerfile \
            docker

      - name: Verify Python
        run: |
          docker run --rm airflow-custom python --version

      - name: Verify Airflow
        run: |
          docker run --rm airflow-custom airflow version

      - name: Verify dbt
        run: |
          docker run --rm airflow-custom dbt --version